        const oldHashHandler = window.onhashchange;
        window.addEventListener('hashchange', function clean() {
          clearInterval(timerHandle); clearTimeout(typeHandle);
          document.removeEventListener('keydown', onKey);
          window.removeEventListener('hashchange', clean);
        });

        paint();
      }

      // ============================================================
      //   VIEW: Session report
      // ============================================================
      function viewSessionReport(root, speechId, sessionId) {
        const sp = STATE.speeches.find(x => x.id === speechId);
        if (!sp) return notFound(root);
        const sess = sp.sessions.find(x => x.id === sessionId);
        if (!sess) return notFound(root);

        const targetTotal = sp.sections.reduce((a, s) => a + s.targetSec, 0);
        const actualTotal = sess.sectionStats.reduce((a, s) => a + s.actual, 0);
        const isCanonicalDemo = sp.id === 'wedding-toast' && (sess.id === 's2' || sp.sessions[sp.sessions.length - 1] === sess);

        // For the demo wedding toast, build a hand-curated diff.
        // For any other session, fall back to a derived approximation.
        const diff = isCanonicalDemo ? DIFF_S2 : derivedDiff(sp, sess);

        root.innerHTML = `
          <div style="display:flex; gap: 16px; align-items: end; justify-content: space-between; flex-wrap: wrap;">
            <div>
              <a href="#/speeches/${sp.id}" class="text-body-sm" style="color: var(--color-muted-ash);">← Back to ${escapeHtml(sp.title)}</a>
              <h1 class="text-heading-lg mt-3">Session report</h1>
              <div class="flex items-center gap-3 mt-3 flex-wrap">
                <span class="text-body-sm" style="color: var(--color-muted-ash);">${fmtRel(sess.date)} · ${sess.mode === 'with-script' ? 'Teleprompter' : 'Freestyle'} · v${sess.versionAtTime}</span>
                <span class="badge pill-soft num"><span class="dot"></span>${fmtTime(actualTotal)} total</span>
                <span class="badge ${actualTotal - targetTotal > 0 ? 'pill-red' : actualTotal - targetTotal < -5 ? 'pill-gold' : 'pill-mint'} num"><span class="dot"></span>${signTime(actualTotal - targetTotal)} vs. target</span>
              </div>
            </div>
            <div class="flex gap-2">
              <a href="#/speeches/${sp.id}/record" class="btn-light">Record again</a>
              <button id="apply-suggestion" class="btn-primary">Apply suggestions to script</button>
            </div>
          </div>

          <!-- ============ Pacing report ============ -->
          <section class="mt-12">
            <div class="flex items-baseline justify-between">
              <h2 class="text-heading">Pacing</h2>
              <span class="text-body-sm" style="color: var(--color-muted-ash);">Target ${fmtTime(targetTotal)} · Actual ${fmtTime(actualTotal)}</span>
            </div>
            <div class="card mt-5" style="padding: 24px;">
              <div style="display: grid; gap: 18px;">
                ${sp.sections.map(sec => {
                  const stat = sess.sectionStats.find(s => s.id === sec.id) || { actual: 0 };
                  const delta = stat.actual - sec.targetSec;
                  const widthTarget = (sec.targetSec / Math.max(targetTotal, 1)) * 100;
                  const widthActual = (stat.actual   / Math.max(targetTotal, 1)) * 100;
                  const color = Math.abs(delta) <= 5 ? 'var(--color-deliver-green)' : delta > 0 ? 'var(--color-leadgen-red)' : 'var(--color-engagement-gold)';
                  return `
                    <div>
                      <div class="flex items-baseline justify-between mb-2">
                        <span class="text-body-sm" style="font-weight: 500;">${escapeHtml(sec.name)}</span>
                        <span class="text-body-sm num" style="color: ${color};">${fmtTime(stat.actual)} / ${fmtTime(sec.targetSec)} · ${signTime(delta)}</span>
                      </div>
                      <div style="position: relative; height: 18px;">
                        <div style="position: absolute; inset: 6px 0; background: rgba(17,17,17,0.04); border-radius: 999px;"></div>
                        <div style="position: absolute; left: 0; top: 6px; height: 6px; width: ${widthTarget}%; background: rgba(17,17,17,0.18); border-radius: 999px;"></div>
                        <div style="position: absolute; left: 0; top: 6px; height: 6px; width: ${widthActual}%; background: ${color}; border-radius: 999px;"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
            <p class="text-caption mt-3" style="color: var(--color-muted-ash);">Light bar: target. Coloured bar: what you actually did.</p>
          </section>

          <!-- ============ Diff view ============ -->
          <section class="mt-14">
            <div class="flex items-baseline justify-between">
              <h2 class="text-heading">What you said vs. what you wrote</h2>
              <span class="text-body-sm" style="color: var(--color-muted-ash);">Showing ${escapeHtml(sp.sections.find(s => s.id === diff.sectionId)?.name || 'section')}</span>
            </div>
            <div class="card-elevated mt-5" style="padding: 28px;">
              <div style="display: grid; gap: 6px;">
                ${diff.rows.map(row => {
                  if (row.kind === 'match') return `<p class="diff-line diff-match">"${escapeHtml(row.spoken)}"</p>`;
                  if (row.kind === 'paraphrase') return `<p class="diff-line diff-paraphrase">"${escapeHtml(row.spoken)}" <span class="meta">— written: "${escapeHtml(row.written)}"</span></p>`;
                  if (row.kind === 'skipped') return `<p class="diff-line diff-skipped">"${escapeHtml(row.written)}"</p>`;
                  if (row.kind === 'improv') return `<p class="diff-line diff-improv">+ "${escapeHtml(row.spoken)}"</p>`;
                  return '';
                }).join('')}
              </div>
              <div class="mt-7 flex gap-2 flex-wrap">
                <span class="badge pill-soft"><span class="dot"></span>${diff.rows.filter(r => r.kind==='match').length} matched</span>
                <span class="badge pill-gold"><span class="dot"></span>${diff.rows.filter(r => r.kind==='paraphrase').length} paraphrased</span>
                <span class="badge pill-red"><span class="dot"></span>${diff.rows.filter(r => r.kind==='skipped').length} skipped</span>
                <span class="badge pill-blue"><span class="dot"></span>${diff.rows.filter(r => r.kind==='improv').length} ad-lib</span>
              </div>
            </div>
          </section>

          <!-- ============ Coach ============ -->
          <section class="mt-14">
            <h2 class="text-heading">Coach</h2>
            <div class="card mt-5" style="padding: 28px; max-width: 760px;">
              <p class="text-body" style="font-family: 'Iowan Old Style', Georgia, serif; font-size: 17px; line-height: 1.65;">
                ${escapeHtml(diff.coachNote)}
              </p>
              <div class="mt-6 flex gap-2 flex-wrap">
                <button class="btn-light" data-suggest="cut-detour">Cut "the gas station detour"</button>
                <button class="btn-light" data-suggest="adopt-improv">Adopt "I think that's when I knew"</button>
                <button class="btn-light" data-suggest="rephrase-final">Rephrase "He told me to keep her" → "He just said, finally"</button>
              </div>
            </div>
          </section>

          ${sess.tags && sess.tags.length ? `
          <section class="mt-14">
            <h2 class="text-heading">Live notes you flagged</h2>
            <div class="card mt-5" style="padding: 24px; max-width: 760px;">
              ${sess.tags.map(t => `
                <div style="display: flex; justify-content: space-between; padding: 10px 0; border-top: 1px solid rgba(17,17,17,0.06);">
                  <span class="text-body-sm">${escapeHtml(t.label)}</span>
                  <span class="text-caption num" style="color: var(--color-muted-ash);">${fmtTime(t.atSec)}</span>
                </div>
              `).join('')}
            </div>
          </section>` : ''}
        `;

        // Suggestions: clicking one stages a script change.
        let staged = [];
        root.querySelectorAll('[data-suggest]').forEach(b => {
          b.addEventListener('click', () => {
            const k = b.getAttribute('data-suggest');
            if (staged.includes(k)) return;
            staged.push(k);
            b.style.opacity = 0.45;
            b.style.pointerEvents = 'none';
            b.insertAdjacentHTML('beforeend', ' <span style="color: var(--color-deliver-green);">staged</span>');
            toast('Staged. Apply to commit.');
          });
        });

        $('#apply-suggestion').addEventListener('click', () => {
          if (staged.length === 0) {
            toast('Pick at least one suggestion above first.');
            return;
          }
          const newV = sp.currentVersion + 1;
          sp.currentVersion = newV;
          sp.versions.push({
            v: newV,
            createdAt: new Date().toISOString(),
            summary: 'Applied ' + staged.length + ' suggestion' + (staged.length > 1 ? 's' : '') + ' from session report'
          });
          // Naive script edit: append a marker so the user sees something changed.
          // A real version would do structured edits. For demo, this is enough.
          const trip = sp.sections.find(s => s.id === 'roadtrip');
          if (trip && staged.includes('cut-detour')) {
            trip.body = trip.body.replace(/We stopped at a gas station near Coalinga\./, '').trim();
          }
          if (trip && staged.includes('adopt-improv')) {
            trip.body += " I think that's when I knew.";
          }
          if (trip && staged.includes('rephrase-final')) {
            trip.body = trip.body.replace(/He told me to keep her\./, "He just said, 'finally.'");
          }
          toast(`Saved as v${newV}.`);
          navigate(`/speeches/${sp.id}`);
        });
      }

      // Fallback diff for non-demo sessions: marks every section as "match"
      // — placeholder until we wire a real alignment.
      function derivedDiff(sp, sess) {
        const sec = sp.sections[Math.floor(sp.sections.length / 2)] || sp.sections[0];
        const sentences = (sec.body.match(/[^.!?]+[.!?]+/g) || [sec.body]).map(s => s.trim());
        return {
          sectionId: sec.id,
          rows: sentences.slice(0, 4).map(s => ({ kind: 'match', spoken: s, written: s })),
          coachNote: 'A real session would surface a specific note here. The pacing graph above is the most useful artifact for now.'
        };
      }

      // ============================================================
      //   VIEW: Versions
      // ============================================================
      function viewVersions(root, speechId) {
        const sp = STATE.speeches.find(x => x.id === speechId);
        if (!sp) return notFound(root);

        root.innerHTML = `
          <a href="#/speeches/${sp.id}" class="text-body-sm" style="color: var(--color-muted-ash);">← Back to ${escapeHtml(sp.title)}</a>
          <h1 class="text-heading-lg mt-3">Version history</h1>
          <p class="text-body mt-3" style="color: var(--color-muted-ash);">Every save makes a new version. Roll back if a change made things worse.</p>

          <div class="card mt-8" style="padding: 8px 24px;">
            ${sp.versions.slice().reverse().map(v => `
              <div class="version-row">
                <span class="version-tag">v${v.v}</span>
                <div>
                  <div class="text-body-sm" style="font-weight: 500;">${escapeHtml(v.summary)}</div>
                  <div class="text-caption mt-1" style="color: var(--color-muted-ash);">${fmtRel(v.createdAt)}</div>
                </div>
                <div class="flex gap-2">
                  ${v.v === sp.currentVersion
                    ? `<span class="badge pill-mint"><span class="dot"></span>Current</span>`
                    : `<button class="btn-light" data-revert="${v.v}">Roll back</button>`}
                </div>
              </div>
            `).join('')}
          </div>
        `;

        root.querySelectorAll('[data-revert]').forEach(b => {
          b.addEventListener('click', () => {
            const v = Number(b.getAttribute('data-revert'));
            // Demo: just stamp a new version that 'reverts' to the prior one.
            sp.currentVersion = sp.versions.length + 1;
            sp.versions.push({
              v: sp.currentVersion,
              createdAt: new Date().toISOString(),
              summary: `Rolled back to v${v}`
            });
            toast(`Rolled back to v${v}. Saved as v${sp.currentVersion}.`);
            render();
          });
        });
      }

      // ============================================================
      //   VIEW: Library — all sessions across all speeches
      // ============================================================
      function viewLibrary(root) {
        const all = STATE.speeches.flatMap(sp => sp.sessions.map(s => ({ sp, s })));
        all.sort((a, b) => new Date(b.s.date) - new Date(a.s.date));

        root.innerHTML = `
          <h1 class="text-heading-lg">All sessions</h1>
          <p class="text-body mt-3" style="color: var(--color-muted-ash);">Every recording, across every speech.</p>

          ${all.length === 0 ? `
            <div class="empty-state mt-8">
              <p class="text-subheading">No sessions yet.</p>
              <p class="text-body mt-3" style="color: var(--color-muted-ash);">Start a speech and hit record.</p>
            </div>
          ` : `
            <div class="card mt-8" style="overflow: hidden;">
              ${all.map(({sp, s}) => {
                const targetTotal = sp.sections.reduce((a,x)=>a+x.targetSec, 0);
                const actualTotal = s.sectionStats.reduce((a,x)=>a+x.actual, 0);
                const delta = actualTotal - targetTotal;
                const color = Math.abs(delta) <= 5 ? 'var(--color-deliver-green)' : delta > 0 ? 'var(--color-leadgen-red)' : 'var(--color-engagement-gold)';
                return `
                  <div class="clickable-row" data-href="/speeches/${sp.id}/sessions/${s.id}">
                    <div>
                      <div class="text-subheading">${escapeHtml(sp.title)}</div>
                      <div class="text-caption mt-1" style="color: var(--color-muted-ash);">${s.mode === 'with-script' ? 'Teleprompter' : 'Freestyle'} · v${s.versionAtTime}</div>
                    </div>
                    <div class="text-body-sm" style="color: var(--color-muted-ash);">${fmtRel(s.date)}</div>
                    <div class="text-body-sm num">${fmtTime(actualTotal)}</div>
                    <div class="text-body-sm num" style="color: ${color}; text-align: right;">${signTime(delta)}</div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        `;

        root.querySelectorAll('[data-href]').forEach(el => {
          el.addEventListener('click', () => navigate(el.getAttribute('data-href')));
        });
      }

      // ============================================================
      //   VIEW: Trends (longitudinal)
      // ============================================================
      function viewTrends(root) {
        const sp = STATE.speeches.find(s => s.sessions.length >= 2);
        if (!sp) {
          root.innerHTML = `
            <h1 class="text-heading-lg">Trends</h1>
            <p class="text-body mt-3" style="color: var(--color-muted-ash);">Once you have more than one session on a speech, you'll see how your pacing changes over time.</p>
            <div class="empty-state mt-8">
              <p class="text-subheading">Not enough data yet.</p>
              <p class="text-body mt-3" style="color: var(--color-muted-ash);">Record two or more sessions on the same speech to unlock trends.</p>
            </div>
          `;
          return;
        }

        const targetTotal = sp.sections.reduce((a, s) => a + s.targetSec, 0);
        root.innerHTML = `
          <h1 class="text-heading-lg">Trends</h1>
          <p class="text-body mt-3" style="color: var(--color-muted-ash);">Watching ${escapeHtml(sp.title)} converge.</p>

          <div class="card mt-8" style="padding: 28px;">
            <div class="text-caption" style="color: var(--color-muted-ash);">Total length, by session</div>
            <div style="display: flex; align-items: end; gap: 16px; height: 200px; margin-top: 24px;">
              ${sp.sessions.map((s, i) => {
                const total = s.sectionStats.reduce((a,x)=>a+x.actual, 0);
                const heightPct = Math.min(100, (total / (targetTotal * 1.5)) * 100);
                const delta = total - targetTotal;
                const color = Math.abs(delta) <= 5 ? 'var(--color-deliver-green)' : delta > 0 ? 'var(--color-leadgen-red)' : 'var(--color-engagement-gold)';
                return `
                  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px;">
                    <span class="text-caption num" style="color: ${color};">${fmtTime(total)}</span>
                    <div style="width: 100%; height: ${heightPct}%; background: ${color}; border-radius: 6px;"></div>
                    <span class="text-caption" style="color: var(--color-muted-ash);">Session ${i+1}</span>
                  </div>
                `;
              }).join('')}
              <!-- target line -->
              <div style="position: relative; flex: 0 0 0;"></div>
            </div>
            <div class="text-caption mt-6" style="color: var(--color-muted-ash);">Target ${fmtTime(targetTotal)}</div>
          </div>
        `;
      }

      // ============================================================
      //   VIEW: Settings
      // ============================================================
      function viewSettings(root) {
        root.innerHTML = `
          <h1 class="text-heading-lg">Settings</h1>
          <div class="grid lg:grid-cols-2 gap-6 mt-10">
            <div class="card" style="padding: 28px;">
              <h3 class="text-heading-sm">Privacy</h3>
              <p class="text-body mt-3" style="color: var(--color-muted-ash);">
                Your recordings are encrypted at rest. We don't use them for training. Default retention is ninety days; change it any time.
              </p>
              <div class="mt-6">
                <label class="text-caption" style="color: var(--color-muted-ash);">Retention</label>
                <select class="input mt-2">
                  <option>30 days</option>
                  <option selected>90 days</option>
                  <option>1 year</option>
                  <option>Until I delete</option>
                </select>
              </div>
            </div>

            <div class="card" style="padding: 28px;">
              <h3 class="text-heading-sm">Recording</h3>
              <p class="text-body mt-3" style="color: var(--color-muted-ash);">
                Tune what happens when you press record.
              </p>
              <div class="mt-6 flex items-center justify-between">
                <span class="text-body-sm">Auto-pause after 3s of silence</span>
                <input type="checkbox" checked />
              </div>
              <div class="mt-4 flex items-center justify-between">
                <span class="text-body-sm">Show waveform during recording</span>
                <input type="checkbox" checked />
              </div>
              <div class="mt-4 flex items-center justify-between">
                <span class="text-body-sm">Save raw audio</span>
                <input type="checkbox" checked />
              </div>
            </div>
          </div>
        `;
      }

      // ============================================================
      //   VIEW: Billing
      // ============================================================
      function viewBilling(root) {
        const left = Math.max(0, STATE.user.sessionsLimit - STATE.user.sessionsUsed);
        root.innerHTML = `
          <h1 class="text-heading-lg">Billing</h1>
          <p class="text-body mt-3" style="color: var(--color-muted-ash);">You're on the Free plan. ${left} session${left===1?'':'s'} left.</p>

          <div class="grid lg:grid-cols-3 gap-5 mt-10">
            <div class="card" style="padding: 28px;">
              <h3 class="text-heading-sm">Free</h3>
              <p class="text-caption mt-2" style="color: var(--color-muted-ash);">Current plan</p>
              <div class="mt-6" style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 56px; line-height: 1;">$0</div>
              <p class="text-body-sm mt-2" style="color: var(--color-muted-ash);">Three sessions, on the house</p>
            </div>
            <div class="card" style="padding: 28px; background: var(--color-midnight-ink); color: var(--color-canvas-white);">
              <h3 class="text-heading-sm">Practiced</h3>
              <p class="text-caption mt-2" style="opacity: 0.6;">Unlimited</p>
              <div class="mt-6" style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 56px; line-height: 1;">$12<span style="font-size: 16px; opacity: 0.6;"> / mo</span></div>
              <p class="text-body-sm mt-2" style="opacity: 0.6;">Or $96 a year — two months free</p>
              <button class="btn-light mt-6" style="background: var(--color-canvas-white); color: var(--color-midnight-ink);">Subscribe</button>
            </div>
            <div class="card" style="padding: 28px;">
              <h3 class="text-heading-sm">Single speech</h3>
              <p class="text-caption mt-2" style="color: var(--color-muted-ash);">One-time</p>
              <div class="mt-6" style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 56px; line-height: 1;">$19</div>
              <p class="text-body-sm mt-2" style="color: var(--color-muted-ash);">Seven days, one speech, no card after</p>
              <button class="btn-light mt-6">Buy the pass</button>
            </div>
          </div>
        `;
      }

      function notFound(root) {
        root.innerHTML = `
          <div class="empty-state" style="margin: 60px auto; max-width: 480px;">
            <h2 class="text-heading-sm">We don't have that one.</h2>
            <p class="text-body mt-3" style="color: var(--color-muted-ash);">The speech might've been deleted, or this link is stale.</p>
            <a href="#/" class="btn-primary mt-6">Back to speeches</a>
          </div>
        `;
      }

      // ---------- Boot ----------
      if (!location.hash) location.hash = '/';
      render();
    })();
    </script>

  </body>
</html>
