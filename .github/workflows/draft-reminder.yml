name: Draft Reminder

on:
  schedule:
    - cron: '0 15 * * *'  # 9 AM MT = 15:00 UTC
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Check and act on stale drafts
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
          INTERNAL_KEY: ${{ secrets.INTERNAL_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node << 'SCRIPT'
          const SUPABASE_URL = process.env.SUPABASE_URL;
          const SUPABASE_KEY = process.env.SUPABASE_KEY;
          const RESEND_KEY = process.env.RESEND_KEY;
          const INTERNAL_KEY = process.env.INTERNAL_KEY;
          const GITHUB_TOKEN = process.env.GITHUB_TOKEN;

          async function sbFetch(method, path, body) {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
              method,
              headers: {
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                Prefer: 'return=minimal',
              },
              body: body ? JSON.stringify(body) : undefined,
            });
            if (!res.ok) {
              const text = await res.text();
              throw new Error(`Supabase ${method} ${path} => ${res.status}: ${text}`);
            }
            return method === 'GET' ? res.json() : null;
          }

          async function main() {
            const drafts = await sbFetch(
              'GET',
              'drafts?status=eq.awaiting_review&select=id,title,email_sent_at,reminder_sent_at,pr_number',
            );

            const now = Date.now();
            let reminders = 0;
            let rejected = 0;

            for (const { id, title, email_sent_at, reminder_sent_at, pr_number } of drafts) {
              const hoursSince = (now - new Date(email_sent_at).getTime()) / 3_600_000;
              console.log(`Draft ${id} ("${title}"): ${hoursSince.toFixed(1)}h since email, reminder=${reminder_sent_at ?? 'none'}`);

              if (hoursSince >= 120) {
                console.log('  -> auto-rejecting');

                if (pr_number) {
                  const r = await fetch(
                    `https://api.github.com/repos/artygracie/speech-prep/pulls/${pr_number}`,
                    {
                      method: 'PATCH',
                      headers: {
                        Authorization: `Bearer ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json',
                        'X-GitHub-Api-Version': '2022-11-28',
                      },
                      body: JSON.stringify({ state: 'closed' }),
                    },
                  );
                  if (!r.ok) console.warn(`     warn: close PR ${pr_number} => ${r.status}`);
                  else console.log(`     closed PR #${pr_number}`);
                }

                await sbFetch('PATCH', `drafts?id=eq.${id}`, {
                  status: 'rejected',
                  status_reason: 'Auto-rejected after 5 days',
                });

                await sbFetch('POST', 'draft_revisions', {
                  draft_id: id,
                  kind: 'system_event',
                  content: 'Auto-rejected after 5 days of no review',
                });

                const emailRes = await fetch('https://api.resend.com/emails', {
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${RESEND_KEY}`,
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({
                    from: 'SpeechPrep <noreply@speechprep.ai>',
                    to: 'gracie@artygroup.com',
                    subject: `Auto-rejected: ${title}`,
                    html: '<p>No review after 5 days. Re-arm from /admin/drafts/rejected if needed.</p>',
                  }),
                });
                if (!emailRes.ok) console.warn(`     warn: rejection email => ${emailRes.status}`);
                else console.log('     rejection email sent');

                rejected++;

              } else if (hoursSince >= 48 && !reminder_sent_at) {
                console.log('  -> sending 48h nudge');

                const nudgeRes = await fetch(
                  'https://speechprep.ai/api/admin/drafts/send-approval',
                  {
                    method: 'POST',
                    headers: {
                      'X-Internal-Key': INTERNAL_KEY,
                      'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ draftId: id }),
                  },
                );
                if (!nudgeRes.ok) console.warn(`     warn: send-approval => ${nudgeRes.status}`);
                else console.log('     approval email re-sent');

                await sbFetch('PATCH', `drafts?id=eq.${id}`, {
                  reminder_sent_at: new Date().toISOString(),
                });

                await sbFetch('POST', 'draft_revisions', {
                  draft_id: id,
                  kind: 'system_event',
                  content: 'Reminder sent (48h)',
                });

                reminders++;

              } else {
                console.log('  -> no action needed');
              }
            }

            console.log(
              `\nChecked ${drafts.length} drafts. ${reminders} reminders sent. ${rejected} auto-rejected.`,
            );
          }

          main().catch(err => {
            console.error('Fatal:', err.message);
            process.exit(1);
          });
          SCRIPT
